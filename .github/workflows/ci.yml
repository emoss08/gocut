name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toy matrix needs the Go release gocut supports (export data version 4). Later 1.27
  # patch releases currently fall back to normal compiles, which the matrix counts as failures.
  GO_VERSION: "1.27.1"

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # Lints are configured in Cargo.toml and clippy.toml; any warning fails CI.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # gocut needs a Unix-like OS; gocut watch and its tests are Linux only.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: cargo test --locked

  toy-matrix:
    name: Toy matrix (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [shadow, active]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build gocut
        run: cargo build --release --locked

      # Every scenario in all three flag modes: default, -N -l, and -N -l -dwarf=false.
      - name: Run the toy matrix
        env:
          GOCUT_MODE: ${{ matrix.mode }}
          MODES: default nl nld
        run: scripts/toy-matrix.sh
