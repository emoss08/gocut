[package]
name = "gocut"
version = "0.1.0"
edition = "2024"
description = "Symbol-level early cutoff for go build, as a -toolexec wrapper"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
