[package]
name = "gocut"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Symbol-level early cutoff for go build, as a -toolexec wrapper"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

# From BeautifulRust (https://github.com/morganlinton/BeautifulRust, lints/lints.toml), without
# its library-only lints (missing_docs, missing_*_doc, exhaustive_enums, print_stdout and
# print_stderr): gocut is a command-line binary that reports on stdout and stderr. Also without
# as_conversions, which flags lossless casts too: the pedantic cast_* lints below catch the lossy
# ones, and a byte-format decoder reads better with `as usize` on a value already in range.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
